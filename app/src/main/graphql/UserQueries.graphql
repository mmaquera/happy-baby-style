# User Queries
# These queries handle user data retrieval

query GetUsers {
  users {
    users {
      ...UserBasicInfo
    }
  }
}

query GetUser($id: ID!) {
  user(id: $id) {
    ...UserBasicInfo
  }
}

query GetUserProfile($id: ID!) {
  userProfile(userId: $id) {
    ...UserProfileBasicInfo
  }
}

query GetCurrentUser {
  currentUser {
    ...UserBasicInfo
  }
}



query GetActiveUsersCount {
  activeUsers {
    ...UserBasicInfo
  }
}