# Simple Queries
# These queries handle basic data retrieval operations

query Health {
  health
}

query DashboardMetrics {
  dashboardMetrics {
    totalUsers
    totalProducts
    totalOrders
    totalRevenue
  }
}

query ProductAnalytics {
  productAnalytics {
    totalProducts
    activeProducts
  }
}

query OrderAnalytics {
  orderAnalytics {
    totalOrders
    totalRevenue
  }
}

query UserAnalytics {
  userAnalytics {
    totalUsers
    activeUsers
  }
}

query ProductStats {
  productStats {
    totalProducts
    activeProducts
  }
}

query OrderStats {
  orderStats {
    totalOrders
    totalRevenue
  }
}

query UserStats {
  userStats {
    totalUsers
    activeUsers
  }
}