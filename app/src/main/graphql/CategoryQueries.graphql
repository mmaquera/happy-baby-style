# Category Queries
# These queries handle category data retrieval

query GetCategories {
  categories {
    ...CategoryBasicInfo
  }
}

query GetCategory($id: ID!) {
  category(id: $id) {
    ...CategoryBasicInfo
  }
}

query GetCategoryBySlug($slug: String!) {
  categoryBySlug(slug: $slug) {
    ...CategoryBasicInfo
  }
}