# Queries para categorías - Happy Baby Style GraphQL

# Fragment para información de categoría
fragment CategoryInfo on Category {
    id
    name
    description
    slug
    imageUrl
    isActive
    sortOrder
    createdAt
    updatedAt
}

# Query para obtener todas las categorías
query GetCategories {
    categories {
        ...CategoryInfo
    }
}

# Query para obtener una categoría por ID
query GetCategory($id: ID!) {
    category(id: $id) {
        ...CategoryInfo
    }
}

# Query para obtener una categoría por slug
query GetCategoryBySlug($slug: String!) {
    categoryBySlug(slug: $slug) {
        ...CategoryInfo
    }
}